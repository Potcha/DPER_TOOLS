[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "video-assistant"
version = "0.1.0"
description = "Scenario-to-timeline video production compiler"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "Proprietary"}

[project.scripts]
video-assistant = "video_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests", "tools"]

